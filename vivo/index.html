<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sol Argentino TV - Ver Transmisión</title>

  <link rel="icon" href="https://solargentinotv.com.ar/assets/media/images/Logo%20SATV%202026.png" type="image/png">

  <!-- Vidstack CSS -->
  <link rel="stylesheet" href="../assets/css/vidstack/1.css">
  <link rel="stylesheet" href="../assets/css/vidstack/2.css">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="https://solargentinotv.com.ar/assets/css/satv.css">
  <link rel="stylesheet" href="https://solargentinotv.com.ar/assets/css/MPlayer.css">

  <!-- Vidstack -->
  <script src="https://cdn.vidstack.io/player" type="module"></script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow-x: hidden !important;
      overflow-y: hidden !important;
    }

    #page-scroll {
      height: 100vh;
      overflow: auto;
    }

    media-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="menu-container">
      <h1 class="logo">Sol Argentino TV</h1>
      <nav class="navbar">
        <ul class="nav-menu">
          <li><a href="https://solargentinotv.com.ar">Inicio</a></li>
          <li><a href="grilla">Programación</a></li>
          <li><a href="vivo" class="active">Ver Transmisión</a></li>
          <li><a href="noticias">Noticias</a></li>
          <li><a href="nosotros">Nosotros</a></li>
          <li><a href="contacto">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <section id="transmision">
      <div class="hero">
        <h1>Ver Transmisión en Vivo</h1>
        <p>¡Sintonizá ahora Sol Argentino TV en vivo!</p>

        <!-- PLAYER -->

        <div id="player">

          <media-player id="satv-player" title="Sol Argentino TV – En Vivo" stream-type="live" autoplay playsinline>
            <media-provider></media-provider>
            <media-video-layout live></media-video-layout>
          </media-player>

        </div>


      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>
      &copy; 2026 Sol Argentino TV - Todos los derechos reservados.
      <a href="contacto">Contactanos</a>
    </p>
  </footer>

  <!-- Scripts propios -->

  <script>
    (async () => {
      // Las 4 URLs reales de SATV
      const calidades = [
        {
          url: "https://rtmp.solargentinotv.com.ar/envivo/canal1-360p.m3u8",
          resolucion: "640x360",
          bandwidth: 800000
        },
        {
          url: "https://rtmp.solargentinotv.com.ar/envivo/canal1-480p.m3u8",
          resolucion: "854x480",
          bandwidth: 1400000
        },
        {
          url: "https://rtmp.solargentinotv.com.ar/envivo/canal1-720p.m3u8",
          resolucion: "1280x720",
          bandwidth: 3000000
        },
        {
          url: "https://rtmp.solargentinotv.com.ar/envivo/canal1-1080p.m3u8",
          resolucion: "1920x1080",
          bandwidth: 5000000
        }
      ];

      // Playlist HLS creada en memoria
      const lineas = [
        "#EXTM3U",
        "#EXT-X-VERSION:3"
      ];

      for (const calidad of calidades) {
        lineas.push(
          `#EXT-X-STREAM-INF:BANDWIDTH=${calidad.bandwidth},RESOLUTION=${calidad.resolucion}`,
          calidad.url
        );
      }

      const contenido = lineas.join("\n") + "\n";

      const blob = new Blob([contenido], {
        type: "application/x-mpegurl"
      });

      const urlHLS = URL.createObjectURL(blob);

      // Esperar a que Vidstack esté cargado
      await customElements.whenDefined("media-player");

      const player = document.getElementById("satv-player");

      // IMPORTANTE: asignar objeto, NO atributo HTML
      player.src = {
        src: urlHLS,
        type: "application/x-mpegurl"
      };

      player.addEventListener("error", (e) => {
        console.error("SATV ERROR:", e.detail);
      });

      player.addEventListener("qualities-change", () => {
        console.log(
          "SATV | Calidades detectadas:",
          Array.from(player.qualities, q => q.height + "p")
        );
      });

      console.log("SATV | Multicalidad HLS inicializada");
    })();
  </script>
  <script src="https://solargentinotv.com.ar/assets/js/script.js"></script>
  <script src="https://solargentinotv.com.ar/assets/js/satv-scroll-main.js"></script>
  <script src="https://solargentinotv.com.ar/assets/js/satv-scroll-dropdown.js"></script>

</body>

</html>
